<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <title>PlayTogether</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <!-- LANDING VIEW -->
  <div id="landing-view">
    <div class="view-container">
      <div class="card">
        <div class="logo-area"><span class="logo-play">Play</span><span class="logo-together">Together</span> <span class="logo-piece">♟️</span></div>
        <p class="tagline">Game night, simplified.</p>
        <button id="create-btn" class="btn btn-primary">Create Game</button>
        <div class="divider"><span>or</span></div>
        <div class="join-section">
          <input id="room-input" class="room-code-input" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
          <button id="join-btn" class="btn btn-secondary">Join Game</button>
        </div>
        <p id="landing-error" class="error-text" hidden></p>
      </div>
    </div>
  </div>

  <!-- WAITING VIEW -->
  <div id="waiting-view" style="display:none">
    <div class="view-container">
      <div class="card">
        <h2>Waiting for player<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></h2>
        <div class="code-display"><span id="display-code"></span></div>
        <p>Share this code with your partner 💜</p>
        <button id="copy-btn" class="btn btn-secondary">Copy Code</button>
        <button id="back-btn" class="btn-link">← Back</button>
      </div>
    </div>
  </div>

  <!-- GAME VIEW -->
  <div id="game-view" style="display:none">
    <header class="game-header">
      <span class="header-logo">♟️ PlayTogether</span>
      <span class="room-badge"><span id="game-room-code"></span></span>
      <div class="header-right">
        <span id="connection-dot" class="status-dot"></span>
        <button id="mic-btn" class="icon-btn" title="Toggle voice">🎤</button>
      </div>
    </header>

    <main class="game-main">
      <div class="board-wrapper">
        <div class="board-container">
          <canvas id="board"></canvas>
        </div>
        <div id="turn-indicator" class="turn-indicator">Waiting...</div>
        <div class="score-bar">
          <span id="p1-score" class="score score-red">● 12</span>
          <span id="p2-score" class="score score-dark">● 12</span>
        </div>
      </div>
    </main>

    <div id="chat-section" class="chat-section collapsed">
      <div id="chat-toggle" class="chat-toggle">
        <span>💬 Chat</span>
        <span id="unread-badge" class="unread-badge" hidden></span>
        <span class="chevron">▲</span>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off">
        <button id="send-chat-btn" class="send-btn">➤</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="winner-text">Player X wins!</h2>
        <p class="overlay-subtitle">Good game! 🎉</p>
        <button id="rematch-btn" class="btn btn-primary">Play Again</button>
        <button id="home-btn" class="btn btn-secondary">Back to Home</button>
      </div>
    </div>
  </div>

  <script src="/js/ws.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>
